# Herdr configuration - symlinked to ~/.config/herdr/config.toml.
# Mirrors this repo's tmux setup (tmux/tmux.conf.symlink) so prefix-key
# muscle memory carries over. Full reference: https://herdr.dev/docs/configuration/

# Herdr otherwise persists this back into this file itself the first time you
# dismiss the screen - but this file gets overwritten by hand periodically
# (e.g. this PR's plugin keybindings), which wipes that persisted flag and
# brings the screen back. Set explicitly instead of relying on herdr's
# runtime write surviving edits to this file.
onboarding = false

[theme]
name = "one-dark"

[keys]
# unbind default prefix (ctrl+b) and set it to ctrl+a, same as tmux
prefix = "ctrl+a"

# tmux's `bind | split-window -h` / `bind - split-window -v`: | makes a
# side-by-side split, - makes a stacked split. Herdr names these actions by
# the resulting divider orientation rather than tmux's flag, so
# split_vertical (vertical divider) is the side-by-side one - opposite of
# what tmux calls it. split_horizontal already defaults to prefix+minus, so
# only split_vertical needs remapping to match the `|` key. There's no named
# alias for it (unlike minus/comma/backtick/etc), so it's the literal char.
split_vertical = "prefix+|"

# tmux's `bind-key -n C-S-Left/Right swap-window`: reorder the current tab
# without needing the prefix. Unset by default in herdr.
move_tab_previous = "ctrl+shift+left"
move_tab_next = "ctrl+shift+right"

# Switch tabs directly with alt+1..9, no prefix needed. cmd would be more
# natural on macOS but terminal apps generally don't forward the Cmd
# modifier over the tty (Alacritty doesn't), so alt is what's reliable here.
[keys.indexed]
tabs = "alt"

# Not remapped, already matching tmux/tmux.conf.symlink's bindings by default:
# - focus_pane_left/down/up/right: prefix+h/j/k/l (tmux's `bind h/j/k/l select-pane`)
# - navigate_pane_left/down/up/right: h/j/k/l
# - workspace_picker: prefix+w (tmux's `prefix + w` window/pane selection)
# - mouse_capture (see [ui] below): true (tmux's `setw -g mouse on`)
#
# Not replicated - herdr has no equivalent and doesn't need one:
# - tpm/resurrect/continuum autosave: herdr's server persists sessions natively
# - copy-mode-vi bindings (v/y, pbcopy): prefix+[ opens herdr's own vim-style
#   copy mode (h/j/k/l, v or space to select, y or enter to copy) out of the box

[ui]
# Capture mouse input for splitting/selecting panes, same as tmux's
# `setw -g mouse on`. This is already the default; kept explicit for parity
# with the tmux config it mirrors.
mouse_capture = true

###############################################################################
# Plugins (installed by install.sh via `herdr plugin install`, see herdr_plugins
# in that script; source lives outside this repo under
# ~/.config/herdr/plugins/, gitignored - see .gitignore)
###############################################################################

# kryptamine/herdr-auto-title: startup-only, no keybinding needed - it just
# renames tabs to match what's running in them.

# paulbkim-dev/vim-herdr-navigation: required for the plugin to work at all,
# this exact binding set is what its README documents. Makes ctrl+h/j/k/l
# cross seamlessly between herdr panes and Neovim splits (vim-tmux-navigator,
# ported to herdr) - see config/nvim/lua/user/plugins.lua for the Neovim side.
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"

# persiyanov/herdr-reviewr: diff/review pane, comment on an agent's changes
# and send feedback back to it. "c" is taken by new_tab, shift+c is free.
[[keys.command]]
key = "prefix+shift+c"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"

# andrewchng/herdr-sessionizer: fuzzy-open projects/worktrees, bootstrap a
# workspace layout from TOML. "s" is taken by settings, shift+s is free.
[[keys.command]]
key = "prefix+shift+s"
type = "plugin_action"
command = "sessionizer.open"
